# ---------------------------------------------------------------------------
# Vulkan-only release build.
#
#   * renderer: Vulkan (NVK) only -- NetherSX2_nx_vk.nro
#   * core:     a single libemucore (4248 by default)
#   * driver:   nxvk -- https://github.com/PalindromicBreadLoaf/nxvk, the public
#               Mesa 26.2.2 NVK port for Tegra X1/GM20B. Upstream NetherSX2_nx
#               links NaGaa95's private NVK bundle (23 archives under vulkan/),
#               which is not in this repository, so a public build has to use
#               nxvk instead (MESA_FLAVOR=nxvk in the Makefile).
#
# Never runs on push: building the driver takes a while and each run publishes
# a release. Trigger it by hand (Actions -> Vulkan release -> Run workflow).
#
# Licensing: nxvk is GPL-2.0-or-later and is linked statically, so the produced
# .nro is a combined work under the GPL. That is fine for a source-available
# project like this one, but anyone shipping the binary has to offer the
# corresponding source -- the release notes say so explicitly.
# ---------------------------------------------------------------------------
name: Vulkan release

on:
  # workflow_dispatch is only reachable for workflows on the default branch, so
  # pushing a commit that mentions [release-vk] (and touches this file) starts
  # a release build from any branch.
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/release-vulkan.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: vk-4248
      core:
        description: Android core to bundle
        required: true
        default: "4248"
        type: choice
        options:
          - "4248"
          - "3668"
      nxvk_ref:
        description: nxvk git ref to build
        required: false
        default: switch
      nxvk_sdk_url:
        description: "Optional: URL of a prebuilt nxvk portlib tarball (skip the build)"
        required: false
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-vulkan
  cancel-in-progress: false

env:
  DEVKITPRO: /opt/devkitpro
  EMU_TARGET: NetherSX2_nx

jobs:
  # -------------------------------------------------------------------------
  # Resolve the release parameters: dispatch inputs are empty on push events.
  # -------------------------------------------------------------------------
  prep:
    name: resolve release parameters
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[release-vk]')
    outputs:
      tag: ${{ steps.params.outputs.tag }}
      core: ${{ steps.params.outputs.core }}
      nxvk_ref: ${{ steps.params.outputs.nxvk_ref }}
      nxvk_sdk_url: ${{ steps.params.outputs.nxvk_sdk_url }}
      prerelease: ${{ steps.params.outputs.prerelease }}
    steps:
      - name: Resolve
        id: params
        run: |
          core="${{ needs.prep.outputs.core }}";            core="${core:-4248}"
          tag="${{ needs.prep.outputs.tag }}";              tag="${tag:-vk-$core-r$GITHUB_RUN_NUMBER}"
          ref="${{ needs.prep.outputs.nxvk_ref }}";         ref="${ref:-switch}"
          url="${{ needs.prep.outputs.nxvk_sdk_url }}";     url="${url:-}"
          pre="${{ needs.prep.outputs.prerelease }}";       pre="${pre:-false}"
          {
            echo "tag=$tag"
            echo "core=$core"
            echo "nxvk_ref=$ref"
            echo "nxvk_sdk_url=$url"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Build the NVK driver. nxvk ships no prebuilt binaries, so the portlib is
  # either downloaded (nxvk_sdk_url) or cross-compiled here and cached.
  # -------------------------------------------------------------------------
  nxvk:
    name: nxvk NVK driver
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      built: ${{ steps.driver.outcome == 'success' }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Download a prebuilt nxvk portlib
        if: needs.prep.outputs.nxvk_sdk_url != ''
        run: |
          set -euo pipefail
          mkdir -p nxvk-pkg
          curl -fsSL "${{ needs.prep.outputs.nxvk_sdk_url }}" -o nxvk.tar.gz
          tar -xzf nxvk.tar.gz -C nxvk-pkg --strip-components=1
          test -f nxvk-pkg/lib/libnvk.a
          test -f nxvk-pkg/lib/libnvk_support.a

      - name: Check out nxvk
        if: needs.prep.outputs.nxvk_sdk_url == ''
        uses: actions/checkout@v4
        with:
          repository: PalindromicBreadLoaf/nxvk
          ref: ${{ needs.prep.outputs.nxvk_ref }}
          fetch-depth: 1
          path: nxvk

      - name: Resolve the nxvk commit
        if: needs.prep.outputs.nxvk_sdk_url == ''
        id: nxvk
        run: echo "sha=$(git -C nxvk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the nxvk build
        if: needs.prep.outputs.nxvk_sdk_url == ''
        uses: actions/cache@v4
        with:
          path: |
            nxvk/switch/build
            nxvk/switch/rust/sysroot
          key: nxvk-${{ runner.os }}-${{ steps.nxvk.outputs.sha }}

      - name: Free disk space
        if: needs.prep.outputs.nxvk_sdk_url == ''
        run: |
          # The nxvk toolchain image plus a Mesa cross build and a Rust sysroot
          # do not fit next to the preinstalled runner toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
                     /opt/hostedtoolcache/CodeQL /usr/lib/jvm 2>/dev/null || true
          df -h /
          docker system df || true

      - name: Build the nxvk toolchain image
        id: image
        if: needs.prep.outputs.nxvk_sdk_url == ''
        continue-on-error: true
        working-directory: nxvk
        run: |
          set +e
          docker build -t nxvk switch/docker 2>&1 | tee "$GITHUB_WORKSPACE/nxvk-image.log"
          exit ${PIPESTATUS[0]}

      # nxvk's recipes mix container work (docker, runs as root, so anything it
      # writes under /work stays root-owned) with host-side `touch`/`cp` in the
      # same recipe. Running make itself under sudo keeps both halves as root;
      # the chown afterwards hands the checkout back to the runner so the cache
      # and the upload steps can read it.
      - name: Build the native Mesa tools
        id: native
        if: needs.prep.outputs.nxvk_sdk_url == '' && steps.image.outcome == 'success'
        continue-on-error: true
        working-directory: nxvk
        run: |
          set +e
          sudo env PATH="$PATH" HOME="$HOME" make CONTAINER=docker \
            switch/build/native-tools/bin/mesa_clc 2>&1 \
            | tee "$GITHUB_WORKSPACE/nxvk-native.log"
          code=${PIPESTATUS[0]}
          sudo chown -R "$(id -u):$(id -g)" nxvk
          exit $code

      - name: Build the Rust std sysroot
        id: sysroot
        if: needs.prep.outputs.nxvk_sdk_url == '' && steps.native.outcome == 'success'
        continue-on-error: true
        working-directory: nxvk
        run: |
          set +e
          sudo env PATH="$PATH" HOME="$HOME" make CONTAINER=docker \
            switch/rust/sysroot/.stamp 2>&1 \
            | tee "$GITHUB_WORKSPACE/nxvk-sysroot.log"
          code=${PIPESTATUS[0]}
          sudo chown -R "$(id -u):$(id -g)" nxvk
          exit $code

      - name: Cross-compile the NVK driver archives
        id: driver
        if: needs.prep.outputs.nxvk_sdk_url == '' && steps.sysroot.outcome == 'success'
        continue-on-error: true
        working-directory: nxvk
        run: |
          set +e
          # AR: nxvk's `package` target merges the per-target archives with
          # $(DEVKITPRO)/devkitA64/bin/aarch64-none-elf-ar on the host, which a
          # plain runner does not have. Static archives are target-agnostic, so
          # the host `ar` is enough. DEVKITPRO is pinned so nxvk.pc's prefix
          # points at the portlib path the devkitPro container uses below.
          sudo env PATH="$PATH" HOME="$HOME" make CONTAINER=docker AR=ar \
            DEVKITPRO=/opt/devkitpro 2>&1 \
            | tee "$GITHUB_WORKSPACE/nxvk-build.log"
          code=${PIPESTATUS[0]}
          sudo chown -R "$(id -u):$(id -g)" nxvk
          exit $code

      # The runner log cannot be read from where this workflow is maintained, so
      # the failing line is encoded into an artifact name and the whole log is
      # committed to the branch (a [skip ci] commit, no re-trigger).
      - name: Collect the diagnostic
        id: diag
        if: steps.image.outcome == 'failure' || steps.native.outcome == 'failure' || steps.sysroot.outcome == 'failure' || steps.driver.outcome == 'failure'
        run: |
          set -euo pipefail
          if   [ "${{ steps.image.outcome }}"   = failure ]; then phase=image;   log="$GITHUB_WORKSPACE/nxvk-image.log"
          elif [ "${{ steps.native.outcome }}"  = failure ]; then phase=native;  log="$GITHUB_WORKSPACE/nxvk-native.log"
          elif [ "${{ steps.sysroot.outcome }}" = failure ]; then phase=sysroot; log="$GITHUB_WORKSPACE/nxvk-sysroot.log"
          else                                                   phase=driver;  log="$GITHUB_WORKSPACE/nxvk-build.log"; fi
          line=$(grep -aiE "error|failed|fatal|no space|not found|denied|panic" "$log" \
                 | grep -av '^\+' | tail -1 | tr -cd '[:print:]' | cut -c1-100)
          [ -n "$line" ] || line="no-error-line-found"
          name="nxvk-$phase-fail-$(printf '%s' "$line" | tr -c 'A-Za-z0-9 ._' '-' | cut -c1-90)"
          echo "diagnostic artifact: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "log=$log" >> "$GITHUB_OUTPUT"

      - name: Upload the failure diagnostic
        if: steps.diag.outputs.log != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.name }}
          path: ${{ steps.diag.outputs.log }}
          if-no-files-found: warn
          retention-days: 14

      - name: Commit the log to the branch
        if: steps.diag.outputs.log != ''
        working-directory: repo
        env:
          BRANCH: ${{ github.ref_name }}
          LOG: ${{ steps.diag.outputs.log }}
          PHASE: ${{ steps.diag.outputs.phase }}
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          cp "$LOG" ".ci-logs/nxvk-$PHASE-${{ github.run_number }}.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH" || true
          git add .ci-logs
          git commit -m "ci: nxvk $PHASE build log for run ${{ github.run_number }} [skip ci]" || exit 0
          git push origin "HEAD:$BRANCH"

      - name: Stage the portlib
        if: steps.driver.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p nxvk-pkg/lib/pkgconfig nxvk-pkg/include
          cp nxvk/switch/build/pkg/lib/libnvk.a nxvk-pkg/lib/
          cp nxvk/switch/build/pkg/lib/libnvk_support.a nxvk-pkg/lib/
          cp nxvk/switch/build/pkg/lib/pkgconfig/nxvk.pc nxvk-pkg/lib/pkgconfig/
          cp -r nxvk/include/vulkan nxvk/include/vk_video nxvk-pkg/include/
          find nxvk-pkg -type f | sort

      - name: Upload the nxvk portlib
        if: needs.prep.outputs.nxvk_sdk_url != '' || steps.driver.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nxvk-portlib
          path: nxvk-pkg
          if-no-files-found: error
          retention-days: 14

  build:
    name: build (Vulkan, core ${{ needs.prep.outputs.core }})
    needs: [prep, nxvk]
    if: needs.nxvk.outputs.built == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PORTLIBS: /opt/devkitpro/portlibs/switch
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools (cmake, ninja, unzip)
        run: |
          set -euo pipefail
          printf '%s\n' 'retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then echo "FAILED after 5 attempts: $*"; return 1; fi; echo "attempt $n failed; retrying"; n=$((n+1)); sleep $((n*10)); done; }' > /tmp/ci-retry.sh
          . /tmp/ci-retry.sh
          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update -qq
          retry apt-get install -y --no-install-recommends cmake ninja-build unzip curl ca-certificates

      - name: Refresh devkitPro package databases
        run: |
          set -euo pipefail
          . /tmp/ci-retry.sh
          retry "$(command -v dkp-pacman || command -v pacman)" -Sy --noconfirm

      - name: Install devkitPro toolchain
        run: |
          set -euo pipefail
          . /tmp/ci-retry.sh
          retry "$(command -v dkp-pacman || command -v pacman)" -S --noconfirm --needed devkitA64 libnx switch-tools

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          . /tmp/ci-retry.sh
          retry "$(command -v dkp-pacman || command -v pacman)" -S --noconfirm --needed \
            switch-mesa switch-curl switch-zlib switch-ntfs-3g \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-libjpeg-turbo

      - name: Install the nxvk portlib
        uses: actions/download-artifact@v4
        with:
          name: nxvk-portlib
          path: nxvk-pkg

      - name: Place the nxvk portlib next to the other portlibs
        run: |
          set -euo pipefail
          mkdir -p "$PORTLIBS/lib/pkgconfig" "$PORTLIBS/include"
          cp nxvk-pkg/lib/libnvk.a nxvk-pkg/lib/libnvk_support.a "$PORTLIBS/lib/"
          cp nxvk-pkg/lib/pkgconfig/nxvk.pc "$PORTLIBS/lib/pkgconfig/"
          rm -rf "$PORTLIBS/include/vulkan" "$PORTLIBS/include/vk_video"
          cp -r nxvk-pkg/include/vulkan nxvk-pkg/include/vk_video "$PORTLIBS/include/"
          "$(command -v dkp-pacman || command -v pacman)" -Ql switch-mesa >/dev/null 2>&1 || true
          ls -l "$PORTLIBS/lib/libnvk.a" "$PORTLIBS/lib/libnvk_support.a"
          PATH="$(dirname "$(command -v aarch64-none-elf-pkg-config || echo /usr/bin/pkg-config)"):$PATH" \
            aarch64-none-elf-pkg-config --libs nxvk || true

      - name: Ensure libexpat (nxvk's driconf needs it)
        run: |
          set -euo pipefail
          if [ -e "$PORTLIBS/lib/libexpat.a" ]; then echo "switch-expat already present"; exit 0; fi
          if "$(command -v dkp-pacman || command -v pacman)" -S --noconfirm --needed switch-expat; then
            echo "installed switch-expat"; exit 0
          fi
          echo "::warning::no switch-expat package; building expat from source"
          curl -fsSL https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.gz -o expat.tar.gz
          tar xzf expat.tar.gz
          cd expat-2.7.1
          ./configure --host=aarch64-none-elf --prefix="$PORTLIBS" \
            --enable-static --disable-shared --without-docbook --without-tests --without-examples
          make -j"$(nproc)"
          make install

      - name: Fetch the ${{ needs.prep.outputs.core }} Android core
        env:
          CORE: ${{ needs.prep.outputs.core }}
        run: |
          set -euo pipefail
          case "$CORE" in
            4248) url="https://github.com/Trixarian/NetherSX2-patch/releases/download/2.2n/NetherSX2-v2.2n-4248.apk" ;;
            3668) url="https://github.com/Trixarian/NetherSX2-classic/releases/download/2.2n/NetherSX2-v2.2n-3668.apk" ;;
            *) echo "unknown core: $CORE" >&2; exit 1 ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/cores/NetherSX2-v2.2n-$CORE"
          curl -fsSL "$url" -o core.apk
          unzip -q -o core.apk -d "$GITHUB_WORKSPACE/cores/NetherSX2-v2.2n-$CORE" \
            "lib/arm64-v8a/libemucore.so" "assets/*"
          ls -l "$GITHUB_WORKSPACE/cores/NetherSX2-v2.2n-$CORE/lib/arm64-v8a/libemucore.so"
          sha256sum "$GITHUB_WORKSPACE/cores/NetherSX2-v2.2n-$CORE/lib/arm64-v8a/libemucore.so" | tee core.sha256

      - name: Build (Vulkan only, single core)
        id: build
        continue-on-error: true
        env:
          CORES_DIR: ${{ github.workspace }}/cores
          CORES: ${{ needs.prep.outputs.core }}
          RENDERERS: VK
          MESA_FLAVOR: nxvk
          JOBS: "4"
        run: |
          set +e
          ./build_all.sh 2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"
          code=${PIPESTATUS[0]}
          SUDO=""; command -v sudo >/dev/null && SUDO=sudo
          $SUDO chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          exit $code

      # Same reason as in the nxvk job: the runner log is not reachable from
      # here, so the log is committed to the branch and the failing line is
      # encoded into an artifact name.
      - name: Collect the build diagnostic
        id: bdiag
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/release-build.log"
          line=$(grep -aiE "error|undefined reference|cannot find|not found|No such file" "$log" \
                 | grep -av '^\+' | tail -1 | tr -cd '[:print:]' | cut -c1-100)
          [ -n "$line" ] || line="no-error-line-found"
          name="build-fail-$(printf '%s' "$line" | tr -c 'A-Za-z0-9 ._' '-' | cut -c1-90)"
          echo "diagnostic artifact: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the build diagnostic
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bdiag.outputs.name }}
          path: ${{ github.workspace }}/release-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit the build log to the branch
        if: steps.build.outcome == 'failure'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          cp "$GITHUB_WORKSPACE/release-build.log" \
             ".ci-logs/release-build-${{ github.run_number }}.log"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH" || true
          git add .ci-logs
          git commit -m "ci: release build log for run ${{ github.run_number }} [skip ci]" || exit 0
          git push origin "HEAD:$BRANCH"

      - name: Fail the job when the build did not produce an .nro
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload the release .nro
        uses: actions/upload-artifact@v4
        with:
          name: NetherSX2-VK-${{ needs.prep.outputs.core }}
          path: NetherSX2.nro
          if-no-files-found: error
          retention-days: 30

      - name: Upload the core checksum
        uses: actions/upload-artifact@v4
        with:
          name: core-sha256
          path: core.sha256
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Publish. `gh release create` keeps the job free of third-party actions.
  # -------------------------------------------------------------------------
  release:
    name: publish release ${{ needs.prep.outputs.tag }}
    needs: [prep, build]
    if: needs.nxvk.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetherSX2-VK-${{ needs.prep.outputs.core }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: core-sha256
          path: dist

      - name: Produce the release notes
        run: |
          set -euo pipefail
          cd dist
          sha256sum NetherSX2.nro | tee NetherSX2.nro.sha256
          {
            echo "Vulkan-only NetherSX2 for the Nintendo Switch, single core (${{ needs.prep.outputs.core }})."
            echo
            echo "* Renderer: Vulkan via NVK only (no OpenGL binary is bundled)."
            echo "* Core: ${{ needs.prep.outputs.core }} (\`libemucore.so\` from the NetherSX2 ${{ needs.prep.outputs.core }} APK)."
            echo "* Driver: nxvk (Mesa 26.2.2 NVK port for Tegra X1), ref \`${{ needs.prep.outputs.nxvk_ref }}\`."
            echo
            echo "## Install"
            echo '```'
            echo "sdmc:/switch/NetherSX2.nro"
            echo "sdmc:/switch/nethersx2/     (BIOS, games, settings)"
            echo '```'
            echo "Run it with a full-memory game override (not applet mode)."
            echo
            echo "## Licence"
            echo "The bundled NVK driver (nxvk) is GPL-2.0-or-later and is linked"
            echo "statically, so this binary is a combined work under the GPL. The"
            echo "corresponding source is this repository plus PalindromicBreadLoaf/nxvk."
            echo
            echo "## Hashes"
            echo '```'
            cat NetherSX2.nro.sha256
            cat core.sha256
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          args=(--title "NetherSX2 Vulkan (core ${{ needs.prep.outputs.core }})" --notes-file notes.md)
          if [ "${{ needs.prep.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" NetherSX2.nro NetherSX2.nro.sha256 \
            --repo "$GITHUB_REPOSITORY" "${args[@]}"

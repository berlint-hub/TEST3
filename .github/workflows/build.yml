name: Build AutoCrispy

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoCrispy (.NET Framework 4.7.2)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore AutoCrispy/AutoCrispy.sln

      - name: Build Solution (Release Any CPU)
        run: msbuild AutoCrispy/AutoCrispy.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrispy-Release
          path: |
            AutoCrispy/AutoCrispy/bin/Release/AutoCrispy.exe
            AutoCrispy/AutoCrispy/bin/Release/AutoCrispy.exe.config

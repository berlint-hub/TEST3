# Shared devkitPro setup for the container jobs.
#
# Each install is a separate step on purpose: the failure shows up as a named
# step in the run summary, which is what makes an untestable CI pipeline
# debuggable (GitHub's log download is not reachable from everywhere).
name: Setup devkitPro
description: Refresh pacman, install devkitA64 + tools and the requested Switch portlibs.

inputs:
  portlibs:
    description: Space separated list of switch-* packages to install.
    required: true

runs:
  using: composite
  steps:
    - name: Refresh package databases
      shell: bash
      run: |
        set -euo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        # -Sy, never -Syu: a full upgrade regularly breaks on outdated Arch
        # mirrors in CI and buys nothing on a throwaway container.
        $SUDO pacman -Sy --noconfirm

    - name: Install toolchain and host tools
      shell: bash
      run: |
        set -euo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        $SUDO pacman -S --noconfirm --needed devkitA64 libnx switch-tools cmake ninja git

    - name: Install Switch portlibs
      shell: bash
      run: |
        set -euo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        # shellcheck disable=SC2086
        $SUDO pacman -S --noconfirm --needed ${{ inputs.portlibs }}

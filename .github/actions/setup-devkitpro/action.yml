# Shared devkitPro setup for the container jobs.
#
# Why this looks more complicated than "run pacman":
# GitHub's log archive (results-receiver.actions.githubusercontent.com) is not
# reachable from every network and the REST API exposes no per-step output, so
# a failing install used to be a single opaque "exit 1". The probe step writes
# the environment facts to a file and publishes it as an artifact (with the key
# numbers folded into the artifact NAME, which is readable via the API), and
# each install phase reports its own error the same way.
#
# -Sy, never -Syu: a full upgrade on a throwaway container regularly breaks on
# stale Arch mirrors and buys nothing.
name: Setup devkitPro
description: Install devkitA64 + tools and the requested Switch portlibs.

inputs:
  portlibs:
    description: Space separated list of switch-* packages to install.
    required: true

runs:
  using: composite
  steps:
    - name: Probe container environment
      id: probe
      shell: bash
      run: |
        set -uo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        P="/$GITHUB_WORKSPACE/probe.txt"; P="${P//\/\//\/}"
        {
          echo "user=$(id -u -n)"
          echo "pacman_bin=$(command -v pacman || echo MISSING)"
          echo "sudo_bin=$(command -v sudo || echo MISSING)"
          echo "pacman_conf_sections=$(grep -c '^\[' /etc/pacman.conf 2>/dev/null || echo 0)"
          echo "available_packages=$(timeout 60 pacman -Sl 2>/dev/null | wc -l)"
          echo "switch_packages=$(timeout 60 pacman -Ssq '^switch-' 2>/dev/null | wc -l)"
          echo "db_refresh=$(timeout 180 $SUDO pacman -Sy --noconfirm 2>&1 | tail -3 | tr '\n' ' ' | tr -c 'A-Za-z0-9 =._:/-' ' ' | cut -c1-120)"
          echo "dkp_pacman=$(command -v dkp-pacman || echo MISSING)"
        } > "$P" 2>&1
        cat "$P"
        echo "path=$P" >> "$GITHUB_OUTPUT"
        echo "summary=user-$(id -u -n)-pacman-$(command -v pacman >/dev/null 2>&1 && echo yes || echo no)-pkgs-$(timeout 60 pacman -Sl 2>/dev/null | wc -l)-switch-$(timeout 60 pacman -Ssq '^switch-' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

    - name: Upload environment probe
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-${{ github.job }}-${{ steps.probe.outputs.summary }}
        path: ${{ steps.probe.outputs.path }}
        if-no-files-found: warn
        retention-days: 1

    - name: Install toolchain and host tools
      id: toolchain
      shell: bash
      run: |
        set -uo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        if ! OUT=$($SUDO pacman -S --noconfirm --needed devkitA64 libnx switch-tools cmake ninja git 2>&1); then
          printf '%s\n' "$OUT" | tail -25 > "$GITHUB_WORKSPACE/diag-toolchain.txt"
          echo "error=$(printf '%s' "$OUT" | tail -1 | tr -c 'A-Za-z0-9 ._+' '-' | cut -c1-90)" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Install Switch portlibs
      id: portlibs
      shell: bash
      run: |
        set -uo pipefail
        SUDO="$(command -v sudo >/dev/null 2>&1 && echo sudo || echo)"
        # shellcheck disable=SC2086
        if ! OUT=$($SUDO pacman -S --noconfirm --needed ${{ inputs.portlibs }} 2>&1); then
          printf '%s\n' "$OUT" | tail -25 > "$GITHUB_WORKSPACE/diag-portlibs.txt"
          echo "error=$(printf '%s' "$OUT" | tail -1 | tr -c 'A-Za-z0-9 ._+' '-' | cut -c1-90)" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Publish install failure reason
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diag-${{ github.job }}-${{ steps.toolchain.outputs.error }}${{ steps.portlibs.outputs.error }}
        path: ${{ github.workspace }}/diag-*.txt
        if-no-files-found: warn
        retention-days: 1

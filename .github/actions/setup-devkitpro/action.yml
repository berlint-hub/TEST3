# Shared devkitPro setup for the container jobs.
#
# The official devkitPro images are NOT all Arch-based: on the Ubuntu-based
# ones there is no `pacman` on PATH, only the `dkp-pacman` wrapper, and host
# tools (cmake/ninja/curl) have to come from apt because dkp-pacman only serves
# devkitPro packages. This action detects which world it is in and does the
# right thing in both.
#
# Why the probing: GitHub's log archive (results-receiver.actions.
# githubusercontent.com) is not reachable from every network and the REST API
# exposes no per-step output, so each phase reports its state through the NAME
# of an uploaded artifact, which IS readable through the API.
name: Setup devkitPro
description: Install devkitA64 + tools and the requested Switch portlibs.

inputs:
  portlibs:
    description: Space separated list of switch-* packages to install.
    required: true

runs:
  using: composite
  steps:
    - name: Detect package manager and host tools
      id: probe
      shell: bash
      run: |
        set -uo pipefail
        PACMAN=""
        for cand in dkp-pacman pacman \
                    /opt/devkitpro/pacman/bin/pacman \
                    /opt/devkitpro/pacman/bin/dkp-pacman; do
          if command -v "$cand" >/dev/null 2>&1; then PACMAN="$cand"; break; fi
        done
        echo "pacman=$PACMAN" >> "$GITHUB_OUTPUT"
        echo "has_apt=$(command -v apt-get >/dev/null 2>&1 && echo yes || echo no)" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release 2>/dev/null && echo "${ID:-unknown}" || echo unknown)" >> "$GITHUB_OUTPUT"
        echo "cmake=$(command -v cmake || echo no)" >> "$GITHUB_OUTPUT"
        echo "ninja=$(command -v ninja || echo no)" >> "$GITHUB_OUTPUT"
        {
          echo "pacman=$PACMAN"
          echo "os=$(. /etc/os-release 2>/dev/null && . /etc/os-release && echo "$NAME")"
          echo "devkitpro=${DEVKITPRO:-unset}"
          echo "dkp_bin=$(ls /opt/devkitpro 2>/dev/null | tr '\n' ' ')"
        } > "$GITHUB_WORKSPACE/probe.txt" 2>&1
        {
          echo "pacman=$PACMAN"
          echo "os=$(. /etc/os-release 2>/dev/null && echo "${ID:-unknown}")"
          echo "devkitpro=${DEVKITPRO:-unset}"
          echo "dkp_bin=$(ls /opt/devkitpro 2>/dev/null | tr '\n' ' ')"
          echo "cmake=$(command -v cmake || echo no)"
          echo "ninja=$(command -v ninja || echo no)"
        } > "$GITHUB_WORKSPACE/probe.txt" 2>&1
        cat "$GITHUB_WORKSPACE/probe.txt"
        if [ -z "$PACMAN" ]; then
          echo "::error::No pacman/dkp-pacman found in the container image."
          exit 1
        fi

    - name: Upload environment probe
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-${{ github.job }}-os-${{ steps.probe.outputs.os }}-pacman-${{ steps.probe.outputs.pacman }}-apt-${{ steps.probe.outputs.has_apt }}
        path: ${{ github.workspace }}/probe.txt
        if-no-files-found: warn
        retention-days: 1

    - name: Install host tools (cmake, ninja)
      shell: bash
      run: |
        set -uo pipefail
        if [ "${{ steps.probe.outputs.has_apt }}" = "yes" ]; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake ninja-build curl ca-certificates
        else
          ${{ steps.probe.outputs.pacman }} -Sy --noconfirm
          ${{ steps.probe.outputs.pacman }} -S --noconfirm --needed cmake ninja curl
        fi

    - name: Install devkitPro toolchain
      id: toolchain
      shell: bash
      run: |
        set -uo pipefail
        PACMAN="${{ steps.probe.outputs.pacman }}"
        if ! OUT=$($PACMAN -Sy --noconfirm 2>&1); then
          printf '%s\n' "$OUT" | tail -25 > "$GITHUB_WORKSPACE/diag-sy.txt"
          exit 1
        fi
        if ! OUT=$($PACMAN -S --noconfirm --needed devkitA64 libnx switch-tools 2>&1); then
          printf '%s\n' "$OUT" | tail -25 > "$GITHUB_WORKSPACE/diag-toolchain.txt"
          exit 1
        fi

    - name: Install Switch portlibs
      id: portlibs
      shell: bash
      run: |
        set -uo pipefail
        # shellcheck disable=SC2086
        if ! OUT=$(${{ steps.probe.outputs.pacman }} -S --noconfirm --needed ${{ inputs.portlibs }} 2>&1); then
          printf '%s\n' "$OUT" | tail -25 > "$GITHUB_WORKSPACE/diag-portlibs.txt"
          exit 1
        fi

    - name: Publish install failure reason
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diag-${{ github.job }}-toolchain-${{ steps.toolchain.conclusion }}-portlibs-${{ steps.portlibs.conclusion }}-apt-${{ steps.probe.outputs.has_apt }}
        path: ${{ github.workspace }}/diag-*.txt
        if-no-files-found: warn
        retention-days: 1

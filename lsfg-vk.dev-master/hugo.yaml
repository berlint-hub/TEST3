baseURL: "https://lsfg-vk.dev"
relativeURLs: true
title: lsfg-vk
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  highlight:
    noClasses: false
menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - identifier: development
      name: Development
      weight: 3
    - name: Auto-builds ↗
      url: "https://builds.lsfg-vk.dev"
      parent: development
    - name: Git Repository ↗
      url: "https://git.lsfg-vk.dev"
      parent: development
    - identifier: help
      name: Help
      weight: 4
    - name: Discord ↗
      url: "https://discord.gg/5cCP6aACgT"
      parent: help
    - name: Discussions ↗
      url: "https://github.com/PancakeTAS/lsfg-vk/discussions"
      parent: help
    - identifier: donate
      name: Donate
      weight: 5
    - name: GitHub Sponsors ↗
      url: "https://github.com/sponsors/PancakeTAS"
      parent: donate
    - name: Ko-fi ↗
      url: "https://ko-fi.com/pancaketas"
      parent: donate
outputs:
  page: [html]
  section: [html]
disableKinds:
 - "404"
 - taxonomy
 - rss
params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /logo.svg
      link: /
      width: 40
  images:
    - images/lsfg-vk_banner.webp
  page:
    displayPagination: false
    width: wide
  blog:
    article:
      displayPagination: false
    list:
      displayTags: true
  footer:
    displayCopyright: false
    displayPoweredBy: false
  search:
    enable: false
